<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>EduFix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar, single content column (max 1080px), views swap in place like a small app. Bench-manual feel: copper accent on cool board-grey. */
:root{
  --bg:#eef1ee; --surface:#fbfcfb; --ink:#17201c; --muted:#59665f; --line:#cfd8d2;
  --accent:#a8480f; --accent-ink:#ffffff; --accent-soft:#f6e4d6; --board:#1f4a3c; --board-ink:#e8f3ee;
  --ok:#1d6b3a; --warn:#8a5a00; --bad:#a3262a;
  --display:'Familjen Grotesk',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101714; --surface:#17201c; --ink:#e6eee9; --muted:#9aa9a1; --line:#2b3a33;
  --accent:#e58a4d; --accent-ink:#1a0e05; --accent-soft:#3a2518; --board:#0c2a21; --board-ink:#d6eadf;
  --ok:#5fc084; --warn:#e0b04a; --bad:#f08486; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101714; --surface:#17201c; --ink:#e6eee9; --muted:#9aa9a1; --line:#2b3a33;
  --accent:#e58a4d; --accent-ink:#1a0e05; --accent-soft:#3a2518; --board:#0c2a21; --board-ink:#d6eadf;
  --ok:#5fc084; --warn:#e0b04a; --bad:#f08486; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.02em}
h2{font-size:1.6rem;letter-spacing:-.01em} h3{font-size:1.1rem}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
.eyebrow{font:500 .75rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* top bar */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font:700 1.35rem var(--display);background:none;border:0;padding:0;display:flex;align-items:center;gap:8px;letter-spacing:-.02em}
.logo i{width:26px;height:26px;background:var(--board);border-radius:3px;position:relative;display:inline-block}
.logo i::after{content:"";position:absolute;inset:6px;border:2px solid var(--accent);border-radius:50% 50% 50% 0}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav button{background:none;border:0;padding:6px 10px;border-radius:6px;color:var(--muted);font-weight:500;font-size:.92rem}
nav button:hover{color:var(--ink);background:var(--line)}
nav button[aria-current=page]{color:var(--ink);box-shadow:inset 0 -2px var(--accent);border-radius:6px 6px 0 0}
.tools{display:flex;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.88rem;display:inline-flex;gap:8px;align-items:center}
kbd{font:500 .72rem var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
main{padding-block:32px 64px;min-height:70vh}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px 18px;font-weight:600;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:8px 12px;font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.stack{display:grid;gap:16px}
.pill{font:500 .72rem var(--mono);border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.bad{color:var(--bad);border-color:var(--bad)}
/* hero */
.hero{background:var(--board);color:var(--board-ink);border-radius:14px;padding:clamp(24px,5vw,52px);display:grid;gap:20px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:
 linear-gradient(var(--board-ink),var(--board-ink)) 0 0/0 0,
 repeating-linear-gradient(90deg,transparent 0 38px,rgba(232,243,238,.05) 38px 39px),
 repeating-linear-gradient(0deg,transparent 0 38px,rgba(232,243,238,.05) 38px 39px);pointer-events:none}
.hero>*{position:relative}
.hero p{max-width:56ch;font-size:1.1rem;opacity:.9}
.hero .btn.ghost{color:var(--board-ink);border-color:var(--board-ink)}
.hero .eyebrow{color:#9fc4b4}
.search{display:flex;gap:8px;background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 6px 6px 14px;align-items:center;max-width:520px;width:100%;border:0;text-align:left}
.search span{color:var(--muted);flex:1}
.topic-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:8px;align-content:start}
.topic-card:hover{border-color:var(--accent)}
.topic-card svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.topic-card .meta{display:flex;gap:6px;flex-wrap:wrap}
.strip{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:12px 16px}
.how{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.how div{border-top:2px solid var(--ink);padding-top:10px}
.how b{font-family:var(--display);font-size:1.05rem}
/* wizard */
.progress{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);transition:width .25s}
@media (prefers-reduced-motion:reduce){.progress>div{transition:none}}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:16px 18px;font-weight:500;font-size:1.05rem;min-height:56px}
.opt:hover{border-color:var(--accent)}
details{border-bottom:1px solid var(--line);padding:12px 0}
summary{cursor:pointer;font-weight:600}
details p{margin-top:8px;color:var(--muted)}
.steps{counter-reset:s;display:grid;gap:10px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 .85rem var(--mono)}
.ivtv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ivtv label{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;gap:6px;align-items:center;font-size:.85rem;background:var(--surface)}
@media(max-width:520px){.ivtv{grid-template-columns:1fr 1fr}}
/* topic */
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
.toc{position:sticky;top:90px;align-self:start;display:grid;gap:6px;font-size:.9rem}
.toc a{color:var(--muted);text-decoration:none}.toc a:hover{color:var(--accent)}
@media(max-width:800px){.toc{position:static}}
.crumbs{font-size:.88rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline}
.sec{display:grid;gap:12px;margin-top:32px}
ul.plain{margin:0;padding-left:20px;display:grid;gap:4px}
.stepper{border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--surface)}
.stepper .head{display:flex;justify-content:space-between;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stepper .body{padding:18px;display:grid;gap:14px}
.why{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.92rem}
.stepper .foot{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);gap:8px}
.tip{border-bottom:1.5px dotted var(--accent);cursor:help;position:relative}
.tip::after{content:attr(data-def);position:absolute;left:0;top:125%;width:min(260px,70vw);background:var(--ink);color:var(--bg);font:400 .82rem/1.4 var(--body);padding:8px 10px;border-radius:6px;opacity:0;pointer-events:none;z-index:5;transition:opacity .12s}
.tip:hover::after,.tip:focus::after{opacity:1}
.nav2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:32px}
/* quiz */
.qopt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px}
.qopt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.qopt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.score{font:700 3.2rem var(--display)}
/* diagram */
.diag{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
@media(max-width:800px){.diag{grid-template-columns:1fr}}
svg.board{width:100%;height:auto;background:var(--board);border-radius:12px}
svg.board .hs{cursor:pointer}
svg.board .hs rect,svg.board .hs circle{fill:rgba(232,243,238,.1);stroke:#9fc4b4;stroke-width:1.5}
svg.board .hs:hover rect,svg.board .hs:focus rect,svg.board .hs.on rect,svg.board .hs.on circle,svg.board .hs:hover circle{fill:var(--accent);stroke:#fff}
svg.board text{fill:#e8f3ee;font:500 11px var(--mono);pointer-events:none}
/* beep */
select,input[type=search],input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.beeps{display:flex;gap:5px;align-items:center}
.beeps i{display:inline-block;height:12px;border-radius:6px;background:var(--accent)}
.beeps .s{width:12px}.beeps .l{width:34px}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
/* palette */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));margin-top:12vh}
dialog::backdrop{background:rgba(5,12,9,.55)}
.pal-list{max-height:50vh;overflow:auto;display:grid}
.pal-list button{background:none;border:0;border-top:1px solid var(--line);text-align:left;padding:10px 16px;display:flex;justify-content:space-between;gap:10px}
.pal-list button:hover,.pal-list button:focus{background:var(--accent-soft)}
.pal-list span{color:var(--muted);font-size:.85rem}
.consent{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;max-width:620px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:16px;display:grid;gap:10px}
.consent a{color:inherit}
footer{border-top:1px solid var(--line);padding-block:24px 40px;color:var(--muted);font-size:.88rem}
</style>

const GLOSS={
 'ESD':'Electrostatic discharge. A static spark from your body that can silently damage chips.',
 'POST':'Power-On Self-Test. The checks the BIOS runs when you press the power button.',
 'BIOS':'Basic firmware on the motherboard that starts the hardware before the operating system loads.',

const T=[
{id:'safety',t:'Safety, ESD and opening the case',ic:'safety',min:6,diff:'Beginner',case:false,
 intro:'Every repair in EduFix starts here. A few habits protect you, the parts and the school lab equipment.',
 sym:['You plan to open a case or touch a board','You shuffle across carpet before handling parts'],
 cause:['Static charge on your body ({{ESD}})','Power still present inside the PSU or on the board','Clutter that leads to dropped screws and bent pins'],
 steps:[['Shut down and unplug','Turn the PC off from the operating system, flip the {{PSU}} switch to 0, then pull the power cable from the wall.','Standby power keeps parts of the board live even when the PC looks off.'],
 ['Press the power button once','With the cable out, hold the power button for 5 seconds to drain leftover charge.','This empties the capacitors so you are not working on a live board.'],
 ['Ground yourself','Put on an ESD wrist strap clipped to bare metal on the case, or touch bare metal often.','Equal charge between you and the case means no spark when you touch a part.'],
 ['Clear and light the workspace','Use a clean, dry table. Keep screws in a small tray, sorted by where they came from.','Mixed screws are the most common reason a case will not close again.'],
 ['Open the case','Remove the two or four thumbscrews at the back and slide the side panel off.','Panels are held by the rear screws only. Forcing them bends the frame.']],
 ver:'The case is open, you are grounded, and no cable is connected to the wall.',
 quiz:[['What is the first step before opening a PC case?',['Remove the RAM','Shut down and unplug the power cable','Touch the CPU','Press Delete at startup'],1,'Power must be fully removed before any part is touched.'],
 ['Why wear an ESD strap?',['To keep the screws magnetic','To equalise charge so static does not damage chips','To cool the CPU','To improve Wi-Fi'],1,'The strap keeps you and the case at the same electrical level.']]},
{id:'components',t:'Know your components',ic:'components',min:7,diff:'Beginner',case:false,

 cause:['Unfamiliar part names','Cables that look alike but carry different power'],
 steps:[['Find the {{Motherboard}}','It is the largest board, mounted flat on {{Standoff}}s. Everything else connects to it.','Knowing the board layout tells you where to look for any fault.'],
 ['Locate the CPU and cooler','Near the top centre, under a heatsink and fan.','A hot or loose cooler explains many random shutdowns.'],
 ['Find the memory slots','Long slots beside the CPU holding {{DIMM}} sticks.','RAM faults are common and easy to test by swapping sticks.'],
 ['Trace the power cables','A wide 24-pin plug goes to the board. A smaller 4 or 8-pin plug goes near the CPU.','Both must be fully seated or the PC will not start.'],
 ['Find the drives','Look for {{SATA}} cables or a small M.2 card lying flat on the board.','Drive problems look like slow starts or "no boot device" messages.']],
 ver:'You can name the board, CPU, RAM, PSU, drive and graphics card and point to each.',

 ['Which part holds BIOS settings when the PC is unplugged?',['RAM','CMOS battery','Fan','GPU'],1,'The CMOS battery keeps settings and the clock alive.']]},
{id:'power',t:'Power problems',ic:'power',min:8,diff:'Beginner',case:true,
 intro:'The PC shows no sign of life. Work from the wall socket inward.',

 steps:[['Check the outside first','Try a different wall socket and a known good power cable. Confirm the PSU switch is on (I).','Most "dead" PCs are a loose cable or a switched-off strip.'],

 ['Try another PSU','Swap in a known good PSU from the lab and press the button.','A PSU can fail under load and still show a green light.']],
 ver:'The fans spin and the BIOS screen appears within a few seconds.',

 ['What does a PSU convert?',['DC to AC','Wall AC power to low-voltage DC','Heat to power','Data to power'],1,'It supplies DC rails to the parts.']]},
{id:'display',t:'No display',ic:'display',min:7,diff:'Beginner',case:false,

 steps:[['Check the monitor itself','Make sure the monitor is on and set to the right input (HDMI, DP or VGA).','The monitor may be listening to the wrong port.'],

 ['A PC has a graphics card. Where should the monitor plug in?',['The motherboard port','The graphics card port','The USB port','Any port'],1,'The card output is the active one.']]},
{id:'boot',t:'Boot failures and beep codes',ic:'boot',min:8,diff:'Intermediate',case:false,
 intro:'The PC powers on but never reaches the desktop. The {{POST}} stage tells you a lot through beeps and messages.',

  ${P.map(([id,n,,,,r])=>{const c=id==='bat';return `<g class="hs ${S.hs===id?'on':''}" tabindex="0" role="button" aria-label="${n}" data-hs="${id}">${c?`<circle cx="${r[0]+r[2]/2}" cy="${r[1]+r[3]/2}" r="${r[2]/2}"/>`:`<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="3"/>`}<text x="${r[0]+4}" y="${r[1]+r[3]+13}">${n.split(' ')[0]}</text></g>`}).join('')}
 </svg>
 <div class="card" aria-live="polite">${h?`<div class="eyebrow">Selected part</div><h3 style="margin:4px 0 8px">${h[1]}</h3><p>${h[2]}</p><p style="margin-top:10px"><b>Common faults:</b> ${h[3]}</p><p style="margin-top:14px"><button class="btn sm" data-go="topic" data-topic="${h[4]}">Open the related guide</button></p>`:'<p style="color:var(--muted)">No part selected yet. Choose one on the board.</p>'}</div></div></div>`}
function beeps(){
 const list=BEEP[S.beepMaker],sel=list[S.beepSel];
 return `<div class="stack" style="max-width:760px"><div><div class="eyebrow">Lookup</div><h2>Beep-code lookup</h2><p style="color:var(--muted)">Pick the BIOS maker shown on the startup screen or in the motherboard manual.</p></div>
 <div><label for="maker" class="eyebrow">BIOS maker</label><select id="maker">${Object.keys(BEEP).map(k=>`<option ${k===S.beepMaker?'selected':''}>${k}</option>`).join('')}</select></div>
 <div class="scroll"><table><thead><tr><th>Pattern</th><th>Sound</th></tr></thead><tbody>${list.map((b,i)=>`<tr><td><button class="btn ${i===S.beepSel?'':'ghost'} sm" data-beep="${i}">${b[0]}</button></td><td><div class="beeps" aria-hidden="true">${b[3].map(x=>`<i class="${x}"></i>`).join('')}</div></td></tr>`).join('')}</tbody></table></div>
 <div class="card" aria-live="polite">${sel?`<div class="eyebrow">Likely cause</div><h3 style="margin:4px 0 6px">${sel[1]}</h3><p><b>Next action:</b> ${sel[2]}</p>`:'<p style="color:var(--muted)">Select a pattern to see the cause and next action.</p>'}</div>
 <p style="font-size:.88rem;color:var(--muted)">Patterns differ between models. Check your motherboard manual if the result does not fit.</p></div>`}
function quiz(){
 const q=S.qz;
 if(!q)return `<div class="stack"><div><div class="eyebrow">Practice</div><h2>Practice quizzes</h2></div><div class="grid">${T.map(t=>`<button class="topic-card" data-go="quiz" data-topic="${t.id}">${ico(t.ic)}<h3>${t.t}</h3><div class="meta"><span class="pill">${t.quiz.length} questions</span>${mem.scores[t.id]!=null?`<span class="pill ok">Best ${mem.scores[t.id]}/${t.quiz.length}</span>`:''}</div></button>`).join('')}</div></div>`;
 const t=T.find(x=>x.id===q.id);
 if(q.done)return `<div class="stack" style="max-width:640px;margin:0 auto"><div class="eyebrow">${esc(t.t)}</div><div class="score">${q.score}/${t.quiz.length}</div><p>${q.score===t.quiz.length?'Perfect score.':q.score>=t.quiz.length/2?'Good work. Review the ones you missed.':'Read the guide again and retry.'}</p>
  <div class="card"><h3 style="margin-bottom:10px">Review answers</h3>${q.log.map((l,i)=>`<details ${l.ok?'':'open'}><summary>${l.ok?'<span class="pill ok">Correct</span>':'<span class="pill bad">Missed</span>'} ${esc(t.quiz[i][0])}</summary><p>Answer: ${esc(t.quiz[i][1][t.quiz[i][2]])}. ${esc(t.quiz[i][3])}</p></details>`).join('')}</div>
  <div class="row"><button class="btn" data-go="quiz" data-topic="${t.id}">Retry</button><button class="btn ghost" data-go="topic" data-topic="${t.id}">Back to guide</button><button class="btn ghost" data-go="quiz" id="allQuiz">All quizzes</button></div></div>`;
 const Q=t.quiz[q.i];
 return `<div class="stack" style="max-width:640px;margin:0 auto"><div class="progress"><div style="width:${q.i/t.quiz.length*100}%"></div></div><div class="eyebrow">${esc(t.t)} · Question ${q.i+1} of ${t.quiz.length}</div><h2>${esc(Q[0])}</h2>
  <div>${Q[1].map((o,i)=>`<button class="qopt ${q.sel==null?'':i===Q[2]?'right':i===q.sel?'wrong':''}" data-ans="${i}" ${q.sel!=null?'disabled':''}>${esc(o)}</button>`).join('')}</div>
  ${q.sel!=null?`<div class="card" aria-live="polite"><b>${q.sel===Q[2]?'Correct.':'Not quite.'}</b> ${esc(Q[3])}</div><div><button class="btn" id="qNext">${q.i===t.quiz.length-1?'See score':'Next question'}</button></div>`:''}</div>`}
function ref(){
 return `<div class="stack" style="gap:32px"><div><div class="eyebrow">Reference</div><h2>Glossary, FAQ and checklists</h2></div>
 <section class="stack"><h3>Glossary</h3><label class="eyebrow" for="gs">Filter terms</label><input type="search" id="gs" placeholder="Type to filter"><div id="gl" class="stack" style="gap:0">${glossHtml('')}</div></section>
 <section><h3 style="margin-bottom:6px">FAQ</h3>${FAQ.map(f=>`<details><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join('')}</section>
 <section class="stack"><h3>Checklists</h3><div class="grid">${CHECK.map((c,ci)=>`<div class="card"><b>${c[0]}</b><div style="display:grid;gap:6px;margin-top:10px">${c[1].map((x,i)=>`<label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="ck${ci}_${i}" style="margin-top:6px"> ${x}</label>`).join('')}</div></div>`).join('')}</div></section></div>`}
function glossHtml(f){const k=Object.keys(GLOSS).sort().filter(x=>(x+GLOSS[x]).toLowerCase().includes(f.toLowerCase()));return k.length?k.map(x=>`<div style="border-bottom:1px solid var(--line);padding:10px 0"><b class="mono">${x}</b><p style="color:var(--muted)">${esc(GLOSS[x])}</p></div>`).join(''):'<p style="color:var(--muted)">No terms match that search.</p>'}
function about(){return `<div class="stack" style="max-width:700px"><div><div class="eyebrow">About</div><h2>About EduFix and your privacy</h2></div>
 <div class="card"><b>Supplementary resource.</b><p style="margin-top:6px">EduFix supports first-year MMSU-CTE students learning computer hardware troubleshooting. It works alongside your lessons and instructor. It is not an intelligent tutoring system.</p></div>
 <div class="card"><b>Purpose of the study</b><p style="margin-top:6px">EduFix is evaluated as part of a research study on how a web-based guide helps students troubleshoot computer hardware.</p></div>
 <div class="card"><b>Data and consent</b><ul class="plain" style="margin-top:8px"><li>Your progress and quiz scores stay in this browser.</li><li>No account, name or email is needed.</li><li>An optional participant code links quiz attempts without personal details.</li><li>You can stop using EduFix at any time.</li></ul>
 <button class="btn ghost sm" id="resetData" style="margin-top:12px">Clear my saved progress</button></div>
 <div class="card"><b>Researcher contact</b><p style="margin-top:6px">Add the researcher's name and campus email here before publishing to participants.</p></div></div>`}
function view(){switch(S.view){case'home':return home();case'topics':return topics();case'topic':return topic();case'wizard':return wizard();case'diagram':return diagram();case'beeps':return beeps();case'quiz':return quiz();case'ref':return ref();case'about':return about()}return `<div class="stack" style="text-align:center;padding:60px 0"><h1>Page not found</h1><p>That page does not exist.</p><div><button class="btn" data-go="home">Back to home</button></div></div>`}
function render(){nav();try{$('#view').innerHTML=view()}catch(e){$('#view').innerHTML='<div class="card"><b>Something went wrong on this page.</b><p style="margin:8px 0 12px">The rest of EduFix still works.</p><button class="btn sm" data-go="home">Back to home</button></div>'}consent()}
/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button,a,.hs');if(!t)return;
 if(t.id==='heroSearch'||t.id==='searchBtn')openPal();
 if(t.id==='themeBtn'){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';store.set('theme',r.dataset.theme)}
 if(t.dataset.jump){e.preventDefault();document.getElementById(t.dataset.jump)?.scrollIntoView({behavior:'smooth'})}
 if(t.id==='nextStep'){S.step++;render()} if(t.id==='prevStep'){S.step--;render()}
 if(t.dataset.wnext){S.wiz.path.push(t.dataset.wnext);render();window.scrollTo(0,0)}
 if(t.id==='wizBack'){S.wiz.path.pop();render()}
 if(t.dataset.gate)openGate(t.dataset.gate);
 if(t.dataset.hs||t.closest('.hs')){S.hs=(t.dataset.hs||t.closest('.hs').dataset.hs);render()}
 if(t.dataset.beep!=null&&t.dataset.beep!==''){S.beepSel=+t.dataset.beep;render()}
 if(t.dataset.ans!=null&&t.dataset.ans!==''){const q=S.qz,T0=T.find(x=>x.id===q.id).quiz[q.i];q.sel=+t.dataset.ans;const ok=q.sel===T0[2];if(ok)q.score++;q.log[q.i]={ok};render()}
 if(t.id==='qNext'){const q=S.qz,tt=T.find(x=>x.id===q.id);if(q.i===tt.quiz.length-1){q.done=true;if((mem.scores[q.id]??-1)<q.score){mem.scores[q.id]=q.score;store.set('scores',mem.scores)}}else{q.i++;q.sel=null}render()}
 if(t.id==='allQuiz'){S.qz=null;render()}
 if(t.id==='resetData'){mem.viewed=[];mem.scores={};mem.last=null;['viewed','scores','last'].forEach(k=>store.set(k,k==='scores'?{}:k==='last'?null:[]));t.textContent='Progress cleared'}
 if(t.id==='acceptConsent'){mem.consent=true;store.set('consent',true);consent()}
 if(t.dataset.palgo){$('#pal').close();const[v,a]=t.dataset.palgo.split(':');if(v==='topic')go('topic',{topic:a,step:0});else if(v==='beeps'){const[m,i]=a.split('|');go('beeps',{beepMaker:m,beepSel:+i})}else go(v)}
});
document.addEventListener('click',e=>{const b=e.target.closest('#nav button, .logo');if(b&&S.view!=='quiz')S.qz=null});
document.addEventListener('input',e=>{if(e.target.id==='gs')$('#gl').innerHTML=glossHtml(e.target.value);if(e.target.id==='palIn')palFill(e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='maker'){S.beepMaker=e.target.value;S.beepSel=-1;render()}});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal()}
 if(S.view==='topic'&&!$('dialog[open]')&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){const t=T.find(x=>x.id===S.topic);if(e.key==='ArrowRight'&&S.step<t.steps.length-1){S.step++;render()}if(e.key==='ArrowLeft'&&S.step>0){S.step--;render()}}
 if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('hs')){e.preventDefault();S.hs=e.target.dataset.hs;render()}
});
/* safety gate */
function openGate(ctx){
 const items=['Power is off and the cable is out of the wall','I have held the power button for 5 seconds','I am grounded with a wrist strap or touching bare metal','My workspace is clear and dry','I know where my screws will go'];
 let d=$('#gate');if(!d){d=document.createElement('dialog');d.id='gate';document.body.appendChild(d)}
 d.innerHTML=`<div style="padding:20px;display:grid;gap:14px"><div class="eyebrow">Safety gate</div><h2>Before you open the case</h2><div style="display:grid;gap:8px">${items.map((x,i)=>`<label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" class="gk" id="gk${i}" style="margin-top:6px"> ${x}</label>`).join('')}</div><div class="row"><button class="btn" id="gc" disabled>Continue</button><button class="btn ghost" id="gx">Cancel</button></div></div>`;
 d.showModal();
 d.addEventListener('change',()=>{$('#gc').disabled=![...d.querySelectorAll('.gk')].every(x=>x.checked)});
 $('#gx').onclick=()=>d.close();
 $('#gc').onclick=()=>{if(ctx!=='wiz')mem.safe[ctx]=true;d.close();if(ctx==='wiz'){const p=S.wiz.path,tp=W[p[p.length-1]].topic;mem.safe[tp]=true;go('topic',{topic:tp,step:0})}else render()};
}
/* search palette */
function palFill(q){
 q=q.trim().toLowerCase();const items=[];
 T.forEach(t=>items.push({k:'Topic',l:t.t,go:'topic:'+t.id,s:t.t+' '+t.sym.join(' ')}));
 Object.keys(GLOSS).forEach(g=>items.push({k:'Glossary',l:g,go:'ref:',s:g+' '+GLOSS[g]}));
 FAQ.forEach(f=>items.push({k:'FAQ',l:f[0],go:'ref:',s:f[0]+' '+f[1]}));
 Object.entries(BEEP).forEach(([m,a])=>a.forEach((b,i)=>items.push({k:'Beep',l:m+' · '+b[0]+' · '+b[1],go:'beeps:'+m+'|'+i,s:m+' '+b[0]+' '+b[1]})));
 const r=(q?items.filter(x=>x.s.toLowerCase().includes(q)):items.filter(x=>x.k==='Topic')).slice(0,12);
 $('#palList').innerHTML=r.length?r.map(x=>`<button data-palgo="${esc(x.go)}">${esc(x.l)}<span>${x.k}</span></button>`).join(''):'<p style="padding:16px;color:var(--muted)">No results. Try a symptom such as "no power" or a part such as "RAM".</p>';
}
function openPal(){const d=$('#pal');if(!d.open)d.showModal();$('#palIn').value='';palFill('');$('#palIn').focus()}
$('#pal').addEventListener('click',e=>{if(e.target.id==='pal')e.target.close()});
function consent(){$('#consentHost').innerHTML=mem.consent?'':`<div class="consent" role="dialog" aria-label="Privacy notice"><span>EduFix saves your progress in this browser only and collects no personal details. See <a href="#" data-go="about">the full notice</a>.</span><div><button class="btn sm" id="acceptConsent">I understand</button></div></div>`}
/* boot */
try{const th=store.get('theme',null);if(th)document.documentElement.dataset.theme=th}catch(e){}
const h0=location.hash.slice(1);if(NAV.some(n=>n[0]===h0))S.view=h0;
render();
</script>

</body></html>
